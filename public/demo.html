<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Widgets Demo</title>
<!-- Deliberately hostile "theme" CSS, to check widgets are isolated from the host site. -->
<style>
body{margin:0;background:#f3f2f2;font-family:Arial,sans-serif;color:red;text-transform:uppercase;letter-spacing:3px;text-align:left}
h2{font-size:12px;color:blue;margin:80px;border-bottom:4px solid lime}
p,div{margin:20px;line-height:3}
button,input{background:purple;color:#fff;height:80px;width:100%;border-radius:40px}
svg{transform:rotate(20deg);max-width:50px}
.col{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr;gap:24px}
</style>
</head>
<body>
<div class="col">
  <div>
    <!-- Platform embed -->
    <script src="platform.js" async></script>
    <div class="ion-widget" data-id="zenotica-coming-soon"></div>
  </div>
  <div>
    <!-- Same code, different settings file -->
    <div class="ion-widget" data-id="demo-coming-soon"></div>
    <!-- Legacy embed (existing Simvoly pages) -->
    <script src="zenotica-coming-soon.js" async></script>
    <div class="zenotica-coming-soon" id="legacy"></div>
  </div>
</div>
<script>
  // Simulates a page builder inserting a widget after load.
  setTimeout(function () {
    var d = document.createElement("div");
    d.className = "ion-widget"; d.setAttribute("data-id", "demo-coming-soon"); d.id = "late";
    document.body.appendChild(d);
  }, 300);
</script>
</body>
</html>
